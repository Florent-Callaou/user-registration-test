databaseChangeLog:
    - changeSet:
        id: 001-create-table-users-202606151411
        author: florent.callaou
        changes:
            - createTable:
                tableName: users
                columns:
                - column:
                    name: id
                    type: BIGINT
                    autoIncrement: true
                    constraints:
                        primaryKey: true
                        nullable: false
                - column:
                    name: username
                    type: VARCHAR(50)
                    constraints:
                        nullable: false
                - column:
                    name: birthdate
                    type: DATE
                    constraints:
                        nullable: false
                - column:
                    name: country_of_residence
                    type: VARCHAR(2)
                    constraints:
                        nullable: false
                - column:
                    name: phone_number
                    type: VARCHAR(20)
                - column:
                    name: gender
                    type: VARCHAR(30)
                - column:
                    name: status
                    type: VARCHAR(20)
                    constraints:
                        nullable: false
                    defaultValue: ACTIVE
                - column:
                    name: anonymization_date
                    type: TIMESTAMP(6)
                - column:
                    name: created_at
                    type: TIMESTAMP(6)
                    constraints:
                        nullable: false
                - column:
                    name: created_by
                    type: VARCHAR(255)
                - column:
                    name: updated_at
                    type: TIMESTAMP(6)
                - column:
                    name: updated_by
                    type: VARCHAR(255)
                        